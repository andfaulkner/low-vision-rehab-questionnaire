schema_version: "1.1"
name: suggest-not-decide
expected_outcome: |
  Claude writes the exclusion as an AI suggestion in the grey columns of
  record 7 (sheet row 8): N8 = Exclude, O8 = "Wrong population (not adults)"
  spelled exactly as in the Lists tab, P8 = a one-line rationale, using
  set_cells.py (or an equivalent XML edit that keeps the x14 drop-downs).
  It does not write the reviewer's columns H-L, because the user has not
  stated a reviewer decision; at most it offers to record one if the
  reviewer confirms. The Counts cached values are recomputed, the CSV
  exports are regenerated, the workbook is never saved through openpyxl, and
  the reply says the suggestion is advisory and the reviewer decides.
context:
  scaffold_script: place-files.sh
